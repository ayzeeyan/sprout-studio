[workspace]
members = [
    "engine/crates/sprout-core",
    "engine/crates/sprout-project",
    "engine/crates/sprout-python",
    "engine/crates/sprout-cli",
    "engine/crates/sprout-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ayzeeyan/sprout-studio"

[workspace.dependencies]
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
